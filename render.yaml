# Free deployment on Render (https://render.com) – no Docker required.
# Create a new "Blueprint" from this repository and Render reads this file.
services:
  - type: web
    name: flashback-summarizer
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      # Optional: point at a free OpenAI-compatible provider (Groq, OpenRouter,
      # Gemini). Leave unset to use the free extractive summarizer.
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_MODEL
        sync: false
      # Optional: restrict which sites may call the API from a browser, e.g.
      # https://<user>.github.io when the frontend runs on GitHub Pages.
      - key: ALLOWED_ORIGINS
        sync: false
